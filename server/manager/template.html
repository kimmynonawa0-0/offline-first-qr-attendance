<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11150f">
  <title>NORWEScan | System management</title>
  <style>
    :root{color-scheme:dark;--bg:#10130f;--panel:#191e17;--line:#30382d;--ink:#f1f2df;--muted:#a9b09b;--yellow:#e6c52f;--green:#668d49;--red:#e38b7b}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% -10%,#304126 0,transparent 42%),var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
    button,input,select{font:inherit}button{border:0;border-radius:10px;padding:12px 16px;background:var(--yellow);color:#15160e;font-weight:800;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:#2d3929;color:var(--ink);border:1px solid #536349}.danger{background:#512c27;color:#ffe7df;border:1px solid #87483e}
    .shell{max-width:1120px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding:8px 0 20px}.brand{font-weight:950;letter-spacing:.08em}.brand span{color:var(--yellow)}.tag{color:var(--muted);font-size:.85rem}.account-tag{max-width:340px;text-align:right}
    .panel{background:linear-gradient(145deg,#1b2119,#151914);border:1px solid var(--line);border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 18px 50px #0003}.panel.inset{background:#12160f;box-shadow:none;margin:14px 0}.login{max-width:440px;margin:12vh auto}.hidden{display:none!important}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(1.6rem,4vw,2.35rem);line-height:1.12}h2{font-size:1.2rem;margin-top:1.4em}p,.muted{color:var(--muted)}label{display:block;color:var(--muted);font-size:.9rem;margin:12px 0 5px}input,select{width:100%;padding:12px;background:#10140f;color:var(--ink);border:1px solid #46503f;border-radius:9px}input[type=file]{padding:9px}
    .password-field{position:relative}.password-field input{padding-right:52px}.password-toggle{position:absolute;right:5px;top:50%;transform:translateY(-50%);padding:8px;background:transparent;color:var(--muted);border:0;transition:color .2s,transform .18s}.password-toggle:hover{color:var(--yellow)}.password-toggle:active{transform:translateY(-50%) scale(.9)}.password-toggle:focus-visible{outline:2px solid var(--yellow);outline-offset:1px}.password-toggle svg{display:block;width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;overflow:visible}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:14px}.metric{font-size:1.8rem;font-weight:900;color:var(--yellow)}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:18px 0}.toolbar.align-end{align-items:end}.tabs{display:flex;overflow:auto;gap:8px;margin:18px 0}.tabs button{white-space:nowrap}.tabs .secondary{background:transparent}.status{min-height:1.5em;color:var(--yellow);margin:10px 0}.error{color:var(--red)}
    .notice{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#20281d;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:12px 0;min-height:0}.notice.error{border-color:#87483e;background:#281413}.icon-button{background:transparent;color:var(--muted);border:0;padding:4px 9px;font-size:1.35rem;line-height:1;border-radius:8px}.icon-button:hover{color:var(--ink);background:#ffffff12}
    .tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:640px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:.82rem;text-transform:uppercase;letter-spacing:.06em}tr:last-child td{border-bottom:0}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 9px;font-size:.8rem}.pill.on{border-color:#63844a;color:#bde095}.pill.off{border-color:#87534b;color:#ffb6a7}
    .picklist{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px}.check{display:flex;align-items:center;gap:9px;padding:6px 3px;color:var(--ink)}.check input{width:auto}.inline-check{display:inline-flex;width:auto;color:var(--ink);margin:0;gap:7px}
    .section-group{border:1px solid var(--line);border-radius:12px;margin:12px 0;padding:12px}.section-group summary{cursor:pointer;color:var(--yellow);font-weight:800;padding:6px}.section-group summary .muted{float:right;font-weight:400}.student-actions{white-space:nowrap}.section-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:8px 0}.student-sections{margin-top:8px}
    .copy-box{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);background:#10140f;border-radius:10px;padding:10px 12px;margin:10px 0}.copy-box code{flex:1;min-width:220px;word-break:break-all;color:var(--yellow);font-size:1rem}.copy-button{background:#2d3929;color:var(--ink);border:1px solid #536349;padding:8px;border-radius:8px}.copy-button svg{display:block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.copy-ok{color:#bde095;font-size:.85rem;font-weight:700}
    .modal-backdrop{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.modal-card{width:min(460px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.modal-card.wide{width:min(720px,100%)}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.modal-head h2{margin:0}.modal-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
    .loading-state{display:flex;align-items:center;gap:10px;color:var(--muted);padding:20px 0}.spinner{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--yellow);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:600px){.shell{padding:14px}.panel{padding:16px}.top{align-items:flex-start}.top .tag{max-width:160px;text-align:right}.modal-card{padding:16px}}
  </style>
</head>
<body>
  <div id="root"></div>
  <noscript>This management console requires JavaScript.</noscript>
  <!-- APP_BUNDLE -->
</body>
</html>
